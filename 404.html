<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hupyy - Loading...</title>
    <script>
      // GitHub Pages SPA redirect script
      // This handles client-side routing by redirecting 404s back to index.html
      // with the path encoded in the URL parameters

      (function() {
        const basePath = '/cpp-grinding-mockup/';
        const fullPath = window.location.pathname;

        // Extract the route by removing the base path
        let route = fullPath;
        if (fullPath.startsWith(basePath)) {
          route = fullPath.substring(basePath.length - 1); // Keep the leading slash
        }

        // Encode the route and redirect to index.html
        const query = route ? '?p=' + route.replace(/&/g, '~and~') : '';
        window.location.replace(basePath + query);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
