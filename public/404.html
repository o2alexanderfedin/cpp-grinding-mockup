<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hupyy - Loading...</title>
    <script>
      // GitHub Pages SPA redirect script
      // This handles client-side routing by redirecting 404s back to index.html
      // with the path encoded in the URL parameters

      const pathSegmentsToKeep = 1; // Keep /cpp-grinding-mockup/

      const path = window.location.pathname
        .split('/')
        .slice(0, 1 + pathSegmentsToKeep)
        .join('/') + '/';

      const redirect = window.location.pathname.slice(path.length - 1);

      const query = redirect
        ? '?p=' + redirect.replace(/&/g, '~and~')
        : '';

      window.location.replace(path + query);
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
